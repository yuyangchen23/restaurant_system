name: Restaurant Backend CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: restaurant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d restaurant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/restaurant_test
      DIRECT_URL: postgresql://test_user:test_password@localhost:5432/restaurant_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.jobs
        uses: actions/setup-node@v7
        with: 
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typescript check
        run: npm run typecheck

      - name: Apply database migration
        run: npx prisma migrate deploy --config prisma7.config.ts

      - name: Test
        run: npm test

      - name: Build
        run: npm run build